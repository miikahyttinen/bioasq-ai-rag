[project]
name = "bioasq-rag-backend"
version = "0.1.0"
description = "Local RAG explorer for the rag-mini-bioasq dataset"
requires-python = ">=3.12,<3.13"
dependencies = [
    "bm25s>=0.3.16",
    "chromadb>=1.5.9",
    "fastapi>=0.165.0",
    "huggingface-hub>=2.4.0",
    "numpy>=2.5.5",
    "ollama>=0.6.3",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "pystemmer>=3.1.0",
    "scikit-learn>=1.9.1",
    "tqdm>=4.70.1",
    "umap-learn>=0.6.0",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
